name: tmp fetch glbs
on:
  push:
    branches: [tmp-glbs]
    paths: [tmp/urls.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: tmp-glbs }
      - run: |
          mkdir -p tmp/glb
          while read -r name url; do
            [ -z "$name" ] && continue
            [ -f "tmp/glb/$name.glb" ] && continue
            case "$url" in https://ocejqvdipitcrjfy.public.blob.vercel-storage.com/*) ;; *) echo "skip $url"; continue;; esac
            curl -fsSL "$url" -o "tmp/glb/$name.glb"
          done < tmp/urls.txt
          git config user.name "glb-fetch" && git config user.email "glb-fetch@users.noreply.github.com"
          git add tmp/glb && git commit -m "tmp: fetched GLBs" && git push || echo nothing
